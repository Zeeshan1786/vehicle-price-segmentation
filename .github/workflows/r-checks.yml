name: R structure checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install runtime dependencies
        run: Rscript scripts/setup.R
      - name: Validate structure and API contracts
        run: Rscript scripts/check.R
